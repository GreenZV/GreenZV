name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: readme-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Render contribution calendar
        uses: GreenZV/readme-blocks/components/contribution@main

      - name: Save contribution assets
        run: |
          for directory in .github/readme/components assets; do
            if [ -d "$directory" ]; then
              git add --all -- "$directory"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update contribution calendar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
